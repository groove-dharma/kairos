# ── Kairós × Fortemi: override de integración ──
# Se aplica ENCIMA de docker-compose.workstation.yml de Fortemi
# (github.com/Fortemi/fortemi) — no corre solo:
#   docker compose -f docker-compose.workstation.yml -f docker-compose.override.yml up -d
# Las rutas de build corresponden a la disposición de desarrollo en la que se
# construyó (todas las piezas bajo una misma raíz). Secretos y rutas del host
# van por variables — define en .env o exporta antes de up:
#   OPENAI_API_KEY · HF_TOKEN · MCP_CLIENT_ID · MCP_CLIENT_SECRET
#   POSTGRES_PASSWORD · DICTADOS_DIR · PROTESIS_DIR · LIBROS_DIR
#   LIBROS_SYNC_DIR · CAJAS_DIR · DELTAS_DIR · N3_REPORTS_DIR

networks:
  internal:
    driver: bridge
    internal: true

services:
  # ── Tinfoil attestation proxy (NUEVO, reemplaza tinfoil-gateway + tinfoil-proxy Docker) ──
  tinfoil-proxy:
    build: ./tinfoil-proxy
    expose:
      - "3302"
    environment:
      - TINFOIL_API_KEY=${OPENAI_API_KEY}
      - REQUEST_TIMEOUT=1200
    networks:
      - internal
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3302/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── SearxNG ──
  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - internal
      - default
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  # ── N3 ──
  n3:
    build: ./n3
    profiles: ["n3"]
    networks:
      - internal
    environment:
      - TINFOIL_API_KEY=${OPENAI_API_KEY}
      - TINFOIL_BASE_URL=http://tinfoil-proxy:3302/v1
      - FORTEMI_MCP_URL=http://fortemi-mcp:3002
      - FORTEMI_REST_URL=http://matric-api:3000
      - SEARXNG_URL=http://searxng:8080
      - MCP_CLIENT_ID=${MCP_CLIENT_ID}
      - MCP_CLIENT_SECRET=${MCP_CLIENT_SECRET}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=matric
      - POSTGRES_USER=matric
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fortemi-local-dev}
      - CREWAI_TRACING_ENABLED=false
      - OTEL_SDK_DISABLED=true
      - OTEL_TRACES_EXPORTER=none
      - E2_MAX_TURNS=40
      - SEARXNG_BLOCKED_TERMS=
    volumes:
      - ./n3:/app
      - n3-data:/app/data
      - "${N3_REPORTS_DIR:-./reports}:/app/reports"
    depends_on:
      - matric-api
      - tinfoil-proxy
      - fortemi-mcp
      - searxng

  # ── Querier  ──
  querier:
    build: ./querier
    profiles: ["querier"]
    networks:
      - internal
    environment:
      - FORTEMI_REST_URL=http://matric-api:3000
      - PYTHONIOENCODING=utf-8
    volumes:
      - ./querier:/app
    depends_on:
      - matric-api

  # ── Black Boxer  ──
  black-boxer:
    build: ./black_boxer
    networks: [internal]
    depends_on: [matric-api]
    restart: unless-stopped
    environment:
      - FORTEMI_REST_URL=http://matric-api:3000
      - PYTHONIOENCODING=utf-8
      - TINFOIL_API_KEY=${OPENAI_API_KEY}
      - TINFOIL_BASE_URL=http://tinfoil-proxy:3302/v1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fortemi-local-dev}
    volumes:
      - "./black_boxer:/app"
      # querier.py montado suelto: el marcador de caja vive ahí — UNA sola
      # fuente hasta que el protocolo 7.5 lo oficialice.
      - "./querier/querier.py:/app/querier.py"
      - "${CAJAS_DIR:-./cajas}:/cajas"


  # ── MCP-Server ──
  fortemi-mcp:
    build: ./mcp-server
    ports:
      - "127.0.0.1:3002:3002"
    networks:
      - internal
      - default
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=3002
      - MCP_TOOL_MODE=full
      - API_BASE=http://matric-api:3000
      - FORTEMI_ALLOW_LOCAL_ISSUER=true
      - ISSUER_URL=http://matric-api:3000
      - MCP_CLIENT_ID=${MCP_CLIENT_ID}
      - MCP_CLIENT_SECRET=${MCP_CLIENT_SECRET}
    depends_on:
      - matric-api

  # ── Ollama-proxy (traduce /api/* → /v1/*, apunta al tinfoil-proxy) ──
  ollama-proxy:
    image: eyalrot2/ollama-openai-proxy:latest
    command: ["src.main:app", "--host", "0.0.0.0", "--port", "11434", "--timeout-keep-alive", "600"]
    restart: unless-stopped
    environment:
      - OPENAI_API_BASE_URL=http://tinfoil-proxy:3302/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=INFO
      - REQUEST_TIMEOUT=600
    networks:
      - internal
    depends_on:
      - tinfoil-proxy

  # ── Ollama dummy (depends_on only) ──────────────────────────────────
  ollama:
    image: alpine:latest
    command: ["sleep", "infinity"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: []
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # ── Redis (job queue) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - workstation-redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # ── GLiNER (NER) ────────────────────────────────────────────────────
  gliner:
    image: ghcr.io/fortemi/fortemi:gliner-latest
    volumes:
      - gliner-models:/root/.cache/huggingface/hub
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
      - default

  # ── Pyannote (speaker diarization) ─────────────────────────────────
  pyannote:
    image: ghcr.io/fortemi/fortemi:pyannote-latest
    volumes:
      - pyannote-models:/root/.cache/huggingface/hub
    environment:
      - PYANNOTE_MODEL=pyannote/speaker-diarization-3.1
      - PYANNOTE_PORT=8001
      - PYANNOTE_DEVICE=cpu
      - HF_TOKEN=${HF_TOKEN}
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - internal
      - default

  # ── STT Proxy (Voxtral/Whisper routing) ─────────────────────────────
  stt-proxy:
    build: ./stt-proxy
    expose:
      - "3303"
    environment:
      - TINFOIL_API_KEY=${OPENAI_API_KEY}
      - VOXTRAL_MODEL=voxtral-small-24b
      - WHISPER_MODEL=whisper-large-v3-turbo
      - DURATION_THRESHOLD=1800
      - REQUEST_TIMEOUT=60
    networks:
      - internal
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3303/health')"]
      interval: 30s
      timeout: 5s
      retries: 3


  # ── matric-api (override de environment) ────────────────────────────
  matric-api:
    networks:
      - internal
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gliner:
        condition: service_started
    environment:
      - OLLAMA_BASE=http://ollama-proxy:11434
      - OLLAMA_HOST=http://ollama-proxy:11434
      - OLLAMA_GEN_MODEL=gpt-oss-120b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_EMBED_DIM=768
      - MATRIC_FAST_GEN_MODEL=gpt-oss-120b
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - GLINER_BASE_URL=http://gliner:8090
      - WHISPER_BASE_URL=http://stt-proxy:3303
      - WHISPER_MODEL=voxtral-small-24b
      - FORTEMI_ALLOW_LOCAL_ISSUER=true
      - ISSUER_URL=http://localhost:3000
      - MATRIC_GEN_TIMEOUT_SECS=300
      - MATRIC_FAST_GEN_TIMEOUT_SECS=300
      - MATRIC_EMBED_TIMEOUT_SECS=120
      - JOB_MAX_CONCURRENT=6
      - NVIDIA_VISIBLE_DEVICES=
      - NVIDIA_DRIVER_CAPABILITIES=
      - OPEN3D_CPU_RENDERING=true
      - RUST_LOG=info
      - REQUIRE_AUTH=false
      - I_UNDERSTAND_NO_AUTH=true
      - WHISPER_TIMEOUT_SECS=1200
      - FTS_MULTILINGUAL_CONFIGS=true
      - FTS_SCRIPT_DETECTION=true
      - AUDIO_CHUNK_DURATION_SECS=300
      - AUDIO_CHUNK_THRESHOLD_SECS=600
      - JOB_TIMEOUT_SECS=1200
      - DIARIZATION_BASE_URL=http://pyannote:8001
      - DIARIZATION_MODEL=pyannote/speaker-diarization-3.1
    volumes:
      - matric-files:/var/lib/matric/files

  # ── Servicios del workstation (asegurar internal) ───────────────────
  postgres:
    networks:
      - internal

  hotm-ui:
    networks:
      - internal
      - default

  agent-proxy:
    environment:
      - OLLAMA_URL=http://ollama-proxy:11434
      - FORTEMI_API_URL=http://matric-api:3000/api/v1
    networks:
      - internal

  # ── Daemon (Nivel 1: captura) ───────────────────────────────────────
  daemon:
    build: ./daemon
    networks:
      - internal
      - default
    volumes:
      - ${DICTADOS_DIR:-./dictados}:/dictados
      - ${PROTESIS_DIR:-./protesis}:/protesis
      - ${LIBROS_DIR:-./libros}:/libros
      - ${LIBROS_SYNC_DIR:-./libros-sync}:/libros-sync
    depends_on:
      postgres:
        condition: service_healthy
      matric-api:
        condition: service_started
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fortemi-local-dev}
      - TINFOIL_API_KEY=${OPENAI_API_KEY}
      - MAX_WORKERS=3


  # ── ElasticSearch (N4: Códex + estado estructurado) ─────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    environment:
      - node.name=codex-01
      - cluster.name=codex
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - ingest.geoip.downloader.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
 
 # ── Daemon delta (N4: materializa deltas JSON en ES y regenera los .md) ──
  daemon-delta:
    build: ./daemon-delta
    networks:
      - internal
    volumes:
      - "${DELTAS_DIR:-./deltas}:/deltas"
    environment:
      - DELTA_HOME=/deltas
      - ES_URL=http://elasticsearch:9200
      - DELTA_POLL=10
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
 

volumes:
  workstation-redis:
  gliner-models:
  matric-files:
  pyannote-models:
  crewai-data:
  n3-data:
  es-data:
