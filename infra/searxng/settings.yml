use_default_settings:
  engines:
    keep_only:
      - arxiv
      - github
      - wikipedia
      - mwmbl
      - marginalia

server:
  secret_key: "ultrasecretkey"  # replace with any random string in your local deploy
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

engines:
  - name: wikipedia
    engine: mediawiki
    base_url: 'https://{language}.wikipedia.org/'
    search_type: text
    language_support: true
  - name: mwmbl
    timeout: 15
